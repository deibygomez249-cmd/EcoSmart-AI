{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block page_title %}Create an Account{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="dashboard-card">
            <h4 class="fw-bold mb-4 text-center"><i class="bi bi-person-plus text-accent-blue"></i> Register</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3">Create Account</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted-custom">Already have an account? <a href="{{ url_for('login') }}" class="text-accent-green">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
